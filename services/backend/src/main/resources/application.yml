server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: tcet-lab-lending-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Neon Object Storage (AWS S3-compatible)
neon:
  storage:
    endpoint: ${AWS_ENDPOINT_URL_S3:}
    region: ${AWS_REGION:us-east-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket-name: ${STORAGE_BUCKET_NAME:lab-photos}

# Security & JWT Configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:tcet-lab-lending-platform-super-secret-production-key-at-least-256-bits!}
      expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    institutional-domain: "tcetmumbai.org"

# OpenAPI & Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    in.tcet.lablending: DEBUG
    org.springframework.security: INFO
